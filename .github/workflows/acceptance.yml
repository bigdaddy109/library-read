name: acceptance

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax + unit tests
        run: |
          for f in docs/*.js; do node --check "$f"; done
          node --test

  playwright-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium + WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium webkit
      - name: Acceptance (fixture Drive Library; Chromium desktop + WebKit iPhone 390; old shell upgrade)
        run: npx playwright test
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance
          path: |
            test-results/
            playwright-report/
          retention-days: 7
