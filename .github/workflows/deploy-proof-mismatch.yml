name: deploy-proof-mismatch

# Pilot only. Forces a wrong shell version so the post-deploy check fails.
# Removed once the red run exists; not part of the shipped trigger.
on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  post-deploy:
    name: post-deploy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_URL: https://bigdaddy109.github.io/library-read/
      EXPECTED_CACHE: library-read-shell-v999
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Curl the live site and match the shell version
        run: bash scripts/deploy-check.sh

      - name: Comment the result
        if: always()
        run: bash scripts/deploy-comment.sh
